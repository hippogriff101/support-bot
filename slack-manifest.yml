# Paste this into https://api.slack.com/apps -> Create New App -> From an app
# manifest. Change the name/description if you like; the rest is what the
# bot needs. See docs/slack-app.md for what each part is for.
display_information:
  name: Support Bot
  description: DM me for help — I'll pass it to the support team.
  background_color: "#1d1c1d"
features:
  app_home:
    home_tab_enabled: true
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
  bot_user:
    display_name: Support
    always_online: true
  shortcuts:
    - name: Edit reply
      type: message
      callback_id: edit_reply
      description: Edit a reply you sent to a user
    - name: Delete reply
      type: message
      callback_id: delete_reply
      description: Unsend a reply you sent to a user
  slash_commands:
    - command: /support
      description: Support bot commands and guides
      usage_hint: help
      should_escape: false
oauth_config:
  scopes:
    bot:
      - channels:history
      - chat:write
      - chat:write.customize
      - commands
      - files:read
      - files:write
      - groups:history
      - im:history
      - im:read
      - im:write
      - reactions:write
      - users:read
settings:
  event_subscriptions:
    bot_events:
      - app_home_opened
      - message.channels
      - message.groups
      - message.im
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
